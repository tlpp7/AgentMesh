name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: R0 system doctor
        run: python scripts/r0_doctor.py --strict
      - name: R0 compatibility tests
        run: python -m pytest tests/test_r0_stabilization.py -q
      - name: CLI smoke test
        run: agentmesh "Check orchestration" --json
