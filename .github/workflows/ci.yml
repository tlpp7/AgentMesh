name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: R0 system doctor
        run: python scripts/r0_doctor.py --strict
      - name: R0 compatibility tests
        run: python -m pytest tests/test_r0_stabilization.py -q
      - name: CLI smoke test
        run: agentmesh "Check orchestration" --json

  r6-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python test dependencies
        run: python -m pip install -e '.[dev,api]' httpx
      - name: Install frontend dependencies
        working-directory: apps/web-v2
        run: npm install
      - name: R6 validation gate
        run: python scripts/r6_release_gate.py --frontend --output r6-release-report.json
      - name: Archive validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r6-release-report
          path: r6-release-report.json
          retention-days: 7

  r7-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API
        run: python -m pip install -e '.[dev,api]' httpx
      - name: Install frontend
        working-directory: apps/web-v2
        run: npm install
      - name: Install Chromium
        working-directory: apps/web-v2
        run: npx playwright install --with-deps chromium
      - name: Test restart persistence
        run: python -m pytest tests/test_r7_restart.py -q
      - name: Test browser flows
        working-directory: apps/web-v2
        run: npm run test:e2e
