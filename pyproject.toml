[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmesh-framework"
version = "0.2.0"
description = "Constraint-aware local multi-agent orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "AgentMesh contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
openai = ["openai>=1.60,<3"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]
postgres = ["psycopg[binary]>=3.2,<4"]
telemetry = ["opentelemetry-api>=1.27,<2", "opentelemetry-sdk>=1.27,<2"]
mcp = ["mcp>=1,<3"]

[project.scripts]
agentmesh = "agentmesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
